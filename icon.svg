<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>dsh-colorful-commands</title>
  <!--
    图标含义：终端折角提示符 + 三条横杠。
    三条横杠对应本插件最有辨识度的功能 —— 命令按危险性分的**三档红**，
    长度与亮度随危险度递增（低 → 中 → 高：越危险越长越亮）。
    色值取自浅色主题下的 commandLow / commandMid / commandHigh。
    透明背景：DSH 会给图标套自己的圆角容器，自带底色会出现双重边框。
  -->
  <path d="M11 18 L23 32 L11 46" stroke="#849BB2" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="32" y="14.5" width="12" height="7.5" rx="3.75" fill="#A7535A"/>
  <rect x="32" y="28.25" width="17" height="7.5" rx="3.75" fill="#C02C38"/>
  <rect x="32" y="42" width="22" height="7.5" rx="3.75" fill="#DE2A18"/>
</svg>
